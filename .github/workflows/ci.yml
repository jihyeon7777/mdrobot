name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python library (no ROS 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mdrobot
        run: pip install -e 'src/mdrobot[serial,dev]'
      - name: Run unit tests
        run: python -m pytest src/mdrobot/test src/mdrobot_plate_ocr/test -v

  ros2:
    name: ROS 2 Jazzy (colcon build + test)
    runs-on: ubuntu-latest
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --packages-select mdrobot mdrobot_cpp mdrobot_ros2_control mdrobot_plate_ocr --event-handlers console_cohesion+
          colcon test-result --verbose

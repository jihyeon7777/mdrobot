[pytest]
# The unit tests live in src/mdrobot/test and exercise the package at
# src/mdrobot/mdrobot. Because test/ has no __init__.py, pytest puts only the
# test directory on sys.path — without naming the package root here, `import
# mdrobot` fails when pytest is run from the repository root.
#
# Passing an explicit path (`pytest src/mdrobot/test`) makes pytest pick
# src/mdrobot/setup.cfg as its config instead of this file, so the same setting
# is repeated there.
#
# Passing both test directories makes the common ancestor src/, which has no ini
# file, so pytest walks up to the repository root and picks this file up.
pythonpath = src/mdrobot src/mdrobot_plate_ocr src/mdrobot_imu src/mdrobot_supervisor
testpaths = src/mdrobot/test src/mdrobot_plate_ocr/test src/mdrobot_imu/test src/mdrobot_supervisor/test

[develop]
script_dir=$base/lib/mdrobot_mecanum
[install]
install_scripts=$base/lib/mdrobot_mecanum

[tool:pytest]
testpaths = test
# test/ has no __init__.py, so pytest puts only the test directory on sys.path.
# Naming this package root makes `import mdrobot_mecanum` work, and ../mdrobot makes
# `import mdrobot` work without installing it. This file is the config pytest picks
# when a path is passed explicitly, e.g. `pytest src/mdrobot_mecanum/test` from the
# repository root; the root pytest.ini repeats the same settings for a bare `pytest`.
pythonpath = . ../mdrobot

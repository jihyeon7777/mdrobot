# mdrobot_rc_bridge — RC telemetry bridge parameters.
#
#   ros2 launch mdrobot_rc_bridge rc_bridge.launch.py
#   ros2 launch mdrobot_rc_bridge rc_bridge.launch.py config:=/path/to/my.yaml
#
# "/**" applies these parameters to the node regardless of name/namespace.
/**:
  ros__parameters:
    # '' auto-detects the board by its USB product string. Prefer this over a
    # ttyACM path: the FTDI motor-controller port shares that numbering space.
    port: ''
    baudrate: 115200
    frame_id: rc
    publish_rate: 50.0      # Hz; the board sends at ~50 Hz
    stale_timeout: 0.3      # s without a frame before the link reads stale
    diag_rate: 2.0          # Hz; diagnostics

    # Channels published as Joy axes, normalised to -1..+1. Only steer (0) and
    # throttle (1) are confirmed to carry 1000-2000 us pulse widths; verify the
    # others with `examples/read_rc_bridge.py --map` before adding them here.
    #   0 steer  1 throttle  2 lift       3 brake     4 mode
    #   5 drill  6 actuator  7 solenoid   8 limit_up  9 limit_down
    axis_channels: [0, 1]
    pwm_min: 1000
    pwm_mid: 1500
    pwm_max: 2000
    deadband: 15            # us around pwm_mid that reads as exactly 0.0
    invert_axes: [-1]       # channels to negate; [-1] = none

    # ── downlink: ROS -> board, over the same ttyACM0 ───────────────────────
    # ~/command carries [lift, brake, drill, actuator, solenoid] and goes out as
    # "lift,brake,drill,actuator,solenoid,checksum" with checksum = their sum.
    # 10 Hz, not 50. Read-only the board streamed 50 Hz for 40 s with zero drops,
    # but once commands went out at 50 Hz the uplink started cutting out roughly
    # once a second — the supervisor logged "no ~/rc within rc_timeout" over and
    # over. Sending at a tenth of that leaves the board's CDC endpoint alone.
    # send_on_command is still true, so a changed command goes out immediately;
    # this rate only governs how often an unchanged one is repeated.
    command_rate: 10.0        # Hz; the last command is resent at this rate
    command_timeout: 0.5      # s without ~/command before idle_command takes over (0 disables)
    idle_command: [0, 0, 0, 0, 0]   # startup + watchdog value: everything off
    # Range each output accepts; anything outside is clamped before it reaches
    # the hardware. Order: lift, brake, drill, actuator, solenoid.
    #   lift      signed speed, confirmed -60..+60
    #   actuator  UNCONFIRMED -- -1/0/+1 is the usual retract/stop/extend shape,
    #             but the firmware was never checked. Verify before trusting it.
    command_min: [-60, 0, 0, -1, 0]
    command_max: [ 60, 1, 1,  1, 1]
    send_on_command: true     # also send the moment a ~/command arrives
    # Line ending the board's parser expects: crlf | lf | cr. Set to match what
    # the board emits; switch to lf or cr if commands are ignored.
    terminator: crlf

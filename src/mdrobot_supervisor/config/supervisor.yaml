# mdrobot_supervisor — the decision layer.
#
#   ros2 launch mdrobot_supervisor supervisor.launch.py
#   ros2 launch mdrobot_supervisor supervisor.launch.py config:=/path/to/my.yaml
#
# "/**" applies these parameters to the node regardless of name/namespace.
/**:
  ros__parameters:
    # 10 Hz, not 50: every tick writes to BOTH controllers over one 19200-baud
    # RS485 bus, and a transaction costs ~12 ms. At 50 Hz the writes alone want
    # 120% of the bus. 10 Hz here plus 10 Hz of joint_states reads is 48%, the
    # same budget mecanum.yaml records as working. The machine tops out at
    # 0.19 m/s, so 10 Hz is far quicker than it can respond anyway.
    rate: 10.0              # Hz; decision and publish rate
    rc_timeout: 0.3         # s without ~/rc before drive stops and equipment idles
    # Extra seconds of RC silence a *running* sequence rides out before it
    # aborts. The wheels still stop at rc_timeout. The board's USB goes
    # quiet for 0.3-0.8 s often enough that aborting on one gap threw away
    # runs mid-spray and dropped the actuator with them.
    # Measured by recording every command frame: the link dies for 3.3-3.5 s at
    # a stretch, about 10.8 s after the actuator starts moving -- the same
    # figure in manual and in autonomous, which is it reaching its end stop and
    # stalling. rc_grace covers those while driving, and holds the equipment a
    # manual operator is still holding the switch for.
    rc_grace: 5.0

    # Phases that command no wheel motion (drill, lift_down, raise, spray,
    # retract) get this instead. The machine is parked with the drill in a hole:
    # the link says nothing about whether it is safe to keep holding, and
    # letting go is the thing that actually causes damage.
    rc_grace_stationary: 20.0

    # ── operator sticks ────────────────────────────────────────────────────
    # steer and throttle are the two channels confirmed to carry pulse widths.
    pwm_min: 1000
    pwm_mid: 1500
    pwm_max: 2000
    deadband: 15            # us around pwm_mid that reads as exactly 0.0
    # How far outside pwm_min..pwm_max a stick may read and still be believed.
    # Beyond that the node STOPS rather than driving. This is not fussiness:
    # normalising an out-of-range value and clamping it yields full deflection,
    # so a stick reading 42819 became +1.0 and the wheels went to full speed the
    # moment the drive node stayed up long enough to write it.
    pwm_tolerance: 200
    # Hold still until both sticks have been seen at centre once, then drive.
    # Re-arms the same way after a lost link or an unreadable frame, so recovery
    # always passes through neutral. The board sends no failsafe: with the
    # transmitter off it emitted 1500/1500 on one occasion and 42819/8051 on
    # another, so a range check alone cannot be trusted to catch a dead link.
    require_neutral_start: true
    # Back to false with the corrected wheel map: the yaw it was cancelling came
    # from the map having the controllers swapped, not from the transmitter.
    invert_steer: false
    invert_throttle: false

    # What full stick deflection asks for. These are operator targets, not what
    # the hardware can do — max_motor_rpm is the hard cap.
    # 0.19 rather than mecanum.yaml's 0.2: at r=0.0625 and gear 20, 0.2 m/s needs
    #   0.2 / 0.0625 = 3.2 rad/s at the wheel -> 30.6 wheel rpm -> x20 = 611 motor rpm
    # against the 600 cap, so full stick was always being scaled back to 0.98 and
    # diagnostics sat at WARN. 0.19 leaves full stick just inside the cap.
    max_linear_x: 0.19      # m/s;   forward/back, both manual modes
    max_linear_y: 0.19      # m/s;   strafe, mecanum mode only
    max_angular_z: 0.37     # rad/s; yaw, base mode only

    # ── mecanum base ───────────────────────────────────────────────────────
    # Geometry from mecanum.yaml. Four wheels on two dual-channel controllers.
    #
    # VALIDATED AS A CHAIN, not measured individually: distance is
    # counts / counts_per_rev x 2pi / gear_ratio x wheel_radius, so only the
    # product matters. Commanding 1.000 m on the encoders drove very close to
    # 1 m on the floor, which puts all three values right together — a
    # wheel_radius 10% out would have shown up as 0.9 m or 1.1 m.
    wheel_radius: 0.0625    # m
    track: 0.575            # m; LEFT-RIGHT wheel centre distance
    wheelbase: 0.5          # m; FRONT-REAR wheel centre distance
    gear_ratio: 20.0        # MOTOR revolutions per WHEEL revolution
    max_motor_rpm: 600.0    # THE hard cap, applied by scaling all four together

    # Flips the vy column ONLY: a wrong value makes strafe go the wrong way and
    # changes nothing else. It cannot be decided by eye — the roller you see from
    # above projects to the mirror of the ground-contact roller that does the
    # work. Only a floor test settles it.  x | o | unknown
    #
    # SETTLED ON THE FLOOR: with the measured wheel map, 'x' strafed the wrong
    # way in mecanum mode while forward and yaw were both correct. 'o' is the
    # layout. This was the last value on the machine still taken on trust.
    roller_layout: o

    # sign = +1 when a POSITIVE rpm drives that wheel FORWARD, in front_left,
    # front_right, rear_left, rear_right order. Which controller and channel each
    # wheel hangs off belongs to mecanum_driver_node, not here.
    #
    # Back to [-1, 1, -1, 1] now that the wheel map is the measured one. These
    # signs and invert_steer were together compensating for a map that had the
    # two controllers the wrong way round.
    #
    # Checked wheel by wheel against the old combination: FORWARD and YAW come
    # out byte-identical, so the directions confirmed on the floor still hold.
    # STRAFE comes out reversed — it was never verified either way, and
    # roller_layout below is the knob for it.
    wheel_signs: [-1, 1, -1, 1]

    # ── equipment ──────────────────────────────────────────────────────────
    lift_speed: 60          # what a full lift request commands (the board takes -60..60)
    # How the operator's lift channel reads. Confirmed on the hardware: the board
    # sends the SPEED itself, in the same -60..60 the downlink takes (it was seen
    # reporting 60). 'tristate' (-1/0/+1) and 'pwm' are the other options.
    lift_input: speed

    # Seconds the lift / actuator may drive one way before the node stops them.
    # Neither has limit switches or position feedback, so holding the switch
    # parks them stalled against an end stop. A stalled motor draws far more
    # current than a moving one, and this machine already sits at 11.5 V — the
    # sag is enough to brown out a motor controller, which is what the comms
    # dropping out mid-run looks like. Once tripped the output stays stopped
    # until the switch returns to neutral. Set 0 to disable.
    # Tune these to just over one full travel.
    # Seconds an output may drive one way before the node stops it. Set these
    # to just over the real stroke: the guard exists to stop a motor sitting on
    # its end stop, and a value well above the stroke lets it stall for the
    # difference.
    #
    # actuator_max_run has to clear the longest continuous push the sequence
    # makes: 12 s raising plus 30 s holding through the spray is 42, so 48.
    # Measured stroke is 12 s; at the old 10 the guard was cutting the actuator
    # off mid-travel and it dropped.
    lift_max_run: 0.0       # Off. The limit switches stop the lift now, at both
                            # ends, in manual and in the sequence. This clock
                            # only ever existed because they were not fitted,
                            # and at 15 s it was cutting the operator off three
                            # times on a stroke that takes ~53 s.
    actuator_max_run: 48.0

    # Limit switches stop the lift at each end, in manual and in the sequence.
    # Fitted and measured: driving the lift to each stop with the channels under
    # watch, f8 went 0 -> 1 at the top and f9 went 0 -> 1 at the bottom.
    #
    # Both switches reading triggered at once is impossible — the carriage
    # cannot be at both ends — so that is treated as a wiring or polarity fault
    # and the lift is held at 0 rather than driven on a reading we do not
    # trust.
    limit_gating: true      # measured: the lift hit its upper stop and f8 went
                            # 0 -> 1, so a closed switch reads 1
    limit_active_value: 1   # a TRIGGERED switch reports 1, measured on the
                            # upper one at the top of its travel

    # ── modes ──────────────────────────────────────────────────────────────
    # The switch reports -1, 0, +1 and these name them in that order.
    #   -1 base        throttle = forward/back, steer = YAW
    #    0 mecanum     throttle = forward/back, steer = STRAFE (no heading change)
    #    1 autonomous  NOT IMPLEMENTED — the node holds still in this mode
    mode_names: ['base', 'mecanum', 'autonomous']

    # ── autonomous approach ────────────────────────────────────────────────
    # Sequence: wait for a plate -> creep forward while strafing onto it ->
    # the plate drops out of view as the machine reaches the car, from which
    # point it drives BLIND for auto_entry_distance -> stop and drill.
    #
    # ENTER is dead reckoning on the wheel encoders. Mecanum wheels slip more
    # than most — the rollers are meant to — so that distance is an estimate,
    # not a measurement, and it decides where a hole gets drilled. Keep the
    # distance short, the speed low, and treat the timeouts as real guards.
    # s without a plate reading before it counts as lost. 2.0, because detection
    # drops out for a beat or two while the machine moves and a short timeout
    # called the plate lost while it was still in plain view — the entry then
    # started metres early.
    #
    # Raising it costs nothing in accuracy any more: the blind entry is measured
    # from where the plate was last actually SEEN, not from where the timeout
    # expired, so the machine still stops auto_entry_distance past the plate
    # however long it waits to be sure.
    auto_plate_timeout: 2.0

    # How wide the plate must have got, as a fraction of the frame, before
    # losing it counts as "we are under the car" rather than "the detector
    # dropped out again". Measured stationary with the plate plainly in view,
    # detection ran at 0.43 Hz with gaps up to 5.5 s -- five of them longer
    # than auto_plate_timeout in 30 s -- so without this gate the sequence
    # declared arrival and drilled roughly every six seconds, wherever it
    # stood. At the position that was wrongly triggering, the plate measured
    # 0.31. Read the real value off a good run: the phase message prints the
    # width at the moment the plate is lost.
    auto_min_approach_width: 0.45
    # A reading this much narrower than the widest one seen is not the plate.
    #
    # ~/plate_offset is published whenever a plate-SHAPED band is found, with
    # no OCR to confirm it is a plate. When the real plate is rejected,
    # something else wins and the offset points at THAT. The detector measured,
    # over thirteen frames:
    #     the plate         0.35 to 0.63
    #     other candidates  0.10  0.14  0.15  0.16
    # and its own width_ratio_range tops out at 0.75 -- so closing on the plate
    # eventually pushes it past that ceiling, the plate drops out, and a
    # 0.1-something candidate from somewhere else in frame takes over. That
    # reads as the plate having jumped, and the machine strafes at it. Which is
    # a plate approached at 0.05 m/s suddenly veering off when it gets close.
    #
    # The apparent width of a plate being approached only grows. A reading that
    # collapses is a different object, and counts as NO plate rather than as a
    # plate somewhere new -- so if the real one has genuinely gone out of view
    # under the car, the sequence enters on the width it reached instead of
    # steering at whatever replaced it.
    #
    # Watch it happen with:  ros2 topic echo /mdrobot_plate_ocr/plate_detail
    auto_plate_shrink_ratio: 0.5
    auto_align_gain: 0.4         # strafe m/s per unit of normalised plate offset
    # Cap on the strafe, as auto_hole_max_speed caps the hole search. Without
    # one a plate at the edge of frame asks for 0.4 m/s sideways -- eight times
    # the hole search, in the direction mecanum rollers give up in first. The
    # cap keeps a small offset closing briskly and only slows the big ones,
    # which is what lowering the gain instead would not do.
    # 0.10 -> 0.06. MEASURED on the machine 2026-09-05, with the IMU finally
    # in 6-axis so the heading could be believed: strafing is what puts the
    # yaw error there.
    #     |vy| > 0.05   ->  |yaw| median 6.7 deg
    #     |vy| < 0.01   ->  |yaw| median 1.4 deg
    # Five times the error, from the strafe alone. Slowing it attacks the
    # cause rather than the symptom, and slowing a machine down cannot
    # destabilise it -- where raising the correction's authority, which is the
    # other lever, can. Alignment took 12.9 s in that run and should take
    # around 20 now, against auto_max_align_seconds of 60.
    auto_align_max_speed: 0.06
    # How old a reading may be and still be STRAFED on. Distinct from
    # auto_plate_timeout, which decides whether the plate is GONE -- a
    # deliberately generous 2.0 s so a dropout is not read as an arrival.
    #
    # run_20260905_193604: detection ran at 1.9 Hz and stopped for good at
    # t=20.2 s with offset -0.125. ALIGN went on commanding vy +0.050 for the
    # remaining two seconds of the timeout -- 10 cm sideways, chasing an
    # offset it had already closed -- and finished beside the plate rather
    # than under it, with the yaw that strafe built handed to ENTER.
    #
    # 0.6 s clears one detector period (0.50 s median gap) so the strafe does
    # not chop on and off at the detector's own rate, and cuts the blind
    # travel from 10 cm to 3. Raise it if detection slows; it must stay well
    # under auto_plate_timeout or it becomes dead code.
    auto_align_offset_max_age: 0.6
    auto_align_tolerance: 0.08   # |offset.x| this small counts as centred
    # 0.08 -> 0.05. The DETECTOR sets the useful speed here, not the wheels:
    # measured at 0.43 Hz with gaps up to 5.5 s, so at 0.08 m/s the machine
    # covers 44 cm between sightings with nothing to steer on. At 0.05 it is
    # 28 cm. Slower still is better if the phase has time -- the ceiling is
    # auto_max_align_seconds.
    auto_approach_speed: 0.05    # m/s forward while aligning
    # m to travel blind after losing the plate. STILL A TEST VALUE, not the
    # measured one: the real figure is the distance from where the plate leaves
    # the camera's view to the centre of the underbody, and it has to be
    # measured on the target vehicle before this drives under anything. The
    # plate is taped on for now and will move when it is refitted, which moves
    # this number with it.
    #
    # 0.3 -> 1.4, the first value meant to reach under the real vehicle rather
    # than just show the entry working. At auto_entry_speed that is 28 s
    # against auto_max_entry_seconds of 60, so the timeout is still a guard and
    # not the thing that stops the run.
    #
    # This is nearly five times as far on dead reckoning, and ENTER is the one phase
    # with nothing to correct against -- no plate, no ceiling camera yet, only
    # the wheel encoders and the IMU holding heading. Two things scale with it
    # and are worth watching in the next recording:
    #   * slip. Mecanum rollers slip by design, so the distance travelled is
    #     an estimate that gets looser the longer it runs.
    #   * yaw. run_20260906_160315 entered at +3.70 deg and finished at -1.50,
    #     but wz was saturated for 34% of a 0.3 m entry. Over 1.4 m a drift the
    #     hold cannot outrun has nearly five times as long to accumulate, and
    #     auto_yaw_abort_deg of 15 is what stands between that and a drill
    #     going into the wrong place.
    # The drill fires wherever this run ends, so every metre here is a metre
    # further under the vehicle before the bit turns.
    auto_entry_distance: 1.4
    auto_entry_speed: 0.05       # m/s forward while entering
    # The working sequence once the machine is under the car. The lift and the
    # drill start together — the bit spins while the lift pushes it up into the
    # underbody — then the lift comes back down, the actuator goes up into the
    # hole, the valve opens, and everything retracts.
    #
    # The bit no longer runs on a clock. auto_drill_seconds (20 s) was removed
    # on 2026-09-06: the upper limit switch closes around 53 s, so the bit
    # stopped a third of the way from the top and the lift spent the rest of
    # the stroke pressing a stationary bit into the underbody. The switch ends
    # both together now, which is the only signal that knows the hole is
    # through.
    # 0 = no backstop, which is what this is set to. The upper switch is fitted
    # and it ends the stroke; drilling through takes as long as it takes, and a
    # clock running alongside the switch can only stop the bit short of the hole
    # it was cutting. 70 was tried on 2026-09-06 and removed the same day for
    # that reason. A run that has gone wrong is stopped by the operator's brake,
    # which works in every phase.
    #
    # Set it positive only to bound the broken-wire case: reaching it stops bit
    # and lift together and logs "NO upper limit in N s", and costs a shallower
    # hole rather than an abort -- unlike the lower switch below, where an
    # unknown position means raising the actuator into a lift that is still up.
    auto_lift_up_seconds: 0.0
    auto_lift_down_seconds: 70.0  # NOT the stroke length -- the lower limit
                                  # switch ends it. This is the fault timeout:
                                  # a full stroke measured ~53 s, so reaching
                                  # 70 with no switch means the switch is
                                  # broken, and the run aborts rather than
                                  # raise the actuator into a lift still up.
    auto_retract_seconds: 12.0     # actuator down after the valve shuts
    auto_max_align_seconds: 60.0
    auto_max_entry_seconds: 60.0

    # Wheel odometry source. 0.0 means ~/joint_states already carries radians,
    # which is what mdrobot_ros2_driver publishes once its OWN counts_per_rev is
    # set. Leave it 0.0 and set counts_per_rev on the drivers; only set a value
    # here if the drivers are publishing raw counts.
    counts_per_rev: 0.0
    # What ~/joint_states actually carries: 'rad', or 'count' with counts_per_rev
    # set above. AUTONOMOUS REFUSES TO RUN while this is 'unset' — the drivers
    # publish raw counts unless their own counts_per_rev is set, and counts taken
    # for radians would end the blind entry in a single tick and fire the drill
    # at the entry point. Measure with examples/calibrate_counts_per_rev.py.
    wheel_position_units: rad

    # ── hole alignment, actuator, spray ────────────────────────────────────
    # After drilling, an upward-facing camera picks out the hole and the machine
    # shuffles until the hole sits over the ACTUATOR, not over the frame centre —
    # hole_target_x/y say where the actuator appears in that frame.
    #
    # The gain SIGNS depend on how the camera is mounted, and the camera is not
    # fitted yet. Verify both on the bench before running this under a car: a
    # wrong sign drives away from the hole until the timeout trips.
    # OFF: the upward camera is not fitted, so nothing publishes ~/hole_offset.
    # With this false the sequence finishes at the drill instead of stalling in
    # find_hole until the timeout. Turn it on once the camera and detector exist.
    # ── yaw hold, off the IMU (mdrobot_imu) ────────────────────────────────
    # OFF by default. With it off nothing about the sequence changes.
    #
    # What it is for: the mecanum inverse kinematics assumes the wheels hold.
    # On a smooth floor they do not, and not equally, so a commanded pure
    # translation comes out as a translation plus a rotation nobody asked for.
    # Until the IMU was fitted nothing measured that.
    #
    # Turning it ON also makes the heading REQUIRED — the sequence aborts if it
    # goes missing or goes stale. A guard that quietly stops guarding is worse
    # than one that was never asked for. Do not switch this on until the
    # sensor's signs have been verified by turning the machine (see
    # mdrobot_imu/README.md): a wrong sign does not wobble, it drives the error
    # the wrong way, under a car, with a drill.
    auto_yaw_hold: true
    auto_yaw_timeout: 0.5
    # MEASURED 2026-09-03: driven 90 s and returned to marks on the floor, the
    # reported heading came back 1.75 deg off — the estimate drifts at roughly
    # 0.02 deg/s. A deadband much under 2 spends its time chasing that drift
    # and rotating the machine to match an error that is not there. A 60 s
    # shuffle at hole-search speed accumulated several degrees of REAL yaw, so
    # the signal is bigger than the drift — but only just, which is why the
    # reference is re-taken at the start of the hole search rather than carried
    # from the entry.
    # 2.0 -> 0.5. The 2.0 came from a 9-axis drift figure of 1.75 deg per 90 s,
    # and that measurement was the magnetometer reading the machine's own
    # motors. In 6-axis, measured 2026-09-05: 0.00 deg over 20 s at rest, and
    # 0.12 deg over a 20 s drive with the gyro integral agreeing to 0.10. An
    # order of magnitude quieter, so the old band was protecting against noise
    # that is no longer there.
    #
    # What it cost: a run handed ENTER +5.7 deg because the machine turned from
    # -1.6 to +1.6 with the strafe still running and nothing corrected it --
    # the whole swing fitted inside the band. By the time it was outside, the
    # rotation had rate behind it. ENTER then took 30 cm to undo an error ALIGN
    # need not have made; it converged to -0.3, so the loop was never the
    # problem.
    #
    # 0.5 is four times the measured 20 s drift. Lower is only worth trying if
    # a run shows it hunting.
    auto_yaw_deadband_deg: 0.5
    auto_yaw_gain: 0.01          # rad/s of wz per degree of heading error
    # About a fifth of max_angular_z (0.37). This runs under a car: it
    # corrects, it does not manoeuvre.
    auto_yaw_max_wz: 0.08
    # Past this the machine and the estimate disagree by more than slip
    # explains — a jammed wheel, a sensor come loose, an estimate run away.
    # Correcting harder is the wrong answer, so the sequence stops.
    #
    # This is the DRIVING figure and it is still a placeholder: how far the
    # heading strays while the correction is actually working has not been
    # measured, because it has not been run. Measure it and tighten this.
    auto_yaw_abort_deg: 15.0
    # The STATIONARY figure — drill, lift_down, raise, spray, retract — where
    # the wheels are commanded to zero and the bit or the actuator is in the
    # hole. Nothing corrects there: steering a machine back with the bit
    # engaged turns it just as much as the fault did. It only stops.
    #
    # MEASURED 2026-09-03: 30 s through a real drill cycle moved the heading
    # 0.42 deg — and 0.02 deg/s of drift alone accounts for 0.6 deg over that
    # window, so the reaction torque's own contribution is not distinguishable
    # from zero on this floor. The fear that the drill twists the machine was
    # not borne out. That is what makes 4 deg defensible: nine times the
    # observed excursion, and still far tighter than the driving limit, which
    # would have let a real twist go unnoticed.
    #
    # CAVEAT on that run: the drive node had the wrong serial port at the time
    # (the two USB adapters had swapped), so the motor controllers were being
    # sent nothing and the wheels were in an uncommanded state. The drill still
    # ran — it is commanded through the RC bridge on its own port — so the
    # reaction torque was real. But whether the wheels were free or holding is
    # unknown, and free wheels resist a twist less, which makes 0.42 deg a
    # conservative figure rather than a wrong one. Worth re-running now the
    # port is fixed.
    #
    # Each stationary phase takes its OWN reference, so this is per-phase
    # rotation, not accumulated drift across the whole sequence.
    auto_yaw_stationary_abort_deg: 4.0
    # How long a stationary phase is given to actually become stationary before
    # that tight limit is enforced.
    #
    # The tick that ENTERS drill is the first one to command zero; the stop
    # happens after it. So the yaw of coasting to a halt was being judged
    # against a limit meant for a bit already buried in steel, and a real run
    # aborted on -4.1 deg before the drill had done anything. The 0.42 deg that
    # justified 4 deg was measured on a machine that was ALREADY stopped, with
    # the motor bus misaddressed so the wheels were never commanded -- it never
    # contained a deceleration.
    #
    # During this window the reference tracks the machine, so what the guard
    # finally holds is the heading it settled at. Raise it if a run still
    # aborts on the stop; the phase clocks are unaffected.
    auto_yaw_settle_seconds: 1.5

    auto_hole_stage: false
    auto_hole_timeout: 0.5        # s without a hole reading before it counts as lost
    auto_hole_target_x: 0.0       # where the actuator sits in the frame, [-1, 1]
    auto_hole_target_y: 0.0
    auto_hole_tolerance: 0.05     # both axes within this counts as lined up
    auto_hole_gain_x: -0.3        # m/s of vy per unit of x offset
    auto_hole_gain_y: -0.3        # m/s of vx per unit of y offset
    auto_hole_max_speed: 0.05     # m/s cap while shuffling under the car
    # 12 s: the actuator's measured full stroke. It was 7, so it only ever got
    # about 60% of the way up before the sequence moved on.
    # Full stroke, measured. Cutting this to 10.0 to keep the actuator off its
    # end stop changed nothing -- the link still died and it still hunted on the
    # way up -- so the stall is not the whole story and the lost stroke bought
    # nothing. Back to the full stroke.
    auto_actuator_seconds: 12.0

    # The actuator does not hold position unpowered — MEASURED: the moment the
    # command goes to 0 it comes straight back down — so the spray has to keep
    # it up or the water leaves the hole it was just placed in.
    #
    # Driving it continuously against the stop made it hunt instead: it sagged
    # and drove and sagged again, two or three times, which is a stalled motor
    # browning out and recovering (or the actuator's own end-of-travel
    # protection cycling). So it is held in PULSES — driven for hold_pulse_on
    # out of every hold_pulse_period. It settles slightly between pushes rather
    # than fighting the stop, at roughly a sixth of the current.
    #
    # If it still hunts, shorten the pulse or lengthen the gap. If it sags out
    # of the hole, do the opposite. The real fix is mechanical: an actuator that
    # holds its own position, or a latch.
    auto_hold_actuator_during_spray: true
    # 0 holds it continuously — which is what manual driving does, and manual
    # holds fine now that the run guard stopped cutting the stroke off. Pulsing
    # let it sag between pushes. Set a period only if it starts hunting against
    # the end stop again.
    auto_hold_pulse_on: 0.4        # s driving, when pulsing
    # Continuous. Pulsing was tried twice, on the theory that parking it against
    # its end stop was what browned the board out; it did not help either time
    # and it lets the actuator sag between pushes. 0 holds continuously. Set a
    # period to go back to pulsing.
    auto_hold_pulse_period: 0.0    # s between pushes; 0 = hold continuously
    auto_spray_seconds: 30.0      # solenoid open, water through the hole
    auto_max_find_hole_seconds: 30.0
    auto_max_hole_align_seconds: 60.0

    # Odometry sanity check. The drivers publish RAW COUNTS unless their own
    # counts_per_rev is set, and counts read as radians look like tens of metres
    # per second — which would carry ENTER through in one tick and drill on the
    # spot. Abort if the measured speed exceeds the fastest commanded speed by
    # more than this factor.
    odom_max_speed_factor: 4.0

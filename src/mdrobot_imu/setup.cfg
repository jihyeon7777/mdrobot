[develop]
script_dir=$base/lib/mdrobot_imu
[install]
install_scripts=$base/lib/mdrobot_imu

[tool:pytest]
# Repeated from the repository-root pytest.ini: passing an explicit path
# (pytest src/mdrobot_imu/test) makes pytest pick this file as its config
# instead, so the package root has to be named here too.
pythonpath = .

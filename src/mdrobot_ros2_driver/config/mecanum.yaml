# mdrobot_ros2_driver — mecanum_driver_node: four wheels, two controllers, ONE bus.
#
#   ros2 launch mdrobot_ros2_driver mecanum.launch.py
#
# Both controllers sit on the same serial port, so exactly one node opens it.
/**:
  ros__parameters:
    port: /dev/ttyUSB0
    baudrate: 19200
    timeout: 0.3

    # Where each wheel lives, in front_left, front_right, rear_left, rear_right
    # order. From the repository's mecanum.yaml.
    # Measured with `measure_travel.py --identify`, one output at a time:
    # controller 1 drives the REAR pair and controller 2 the FRONT.
    #   ctrl1 ch1 = rear_right   ctrl1 ch2 = rear_left
    #   ctrl2 ch1 = front_left   ctrl2 ch2 = front_right
    wheel_slave_ids: [2, 2, 1, 1]
    wheel_channels: [1, 2, 2, 1]
    joint_names: ['front_left', 'front_right', 'rear_left', 'rear_right']

    # Counts per revolution of the MOTOR shaft, per wheel. Set these and
    # joint_states carries radians; leave them 0.0 and it carries RAW COUNTS,
    # which the supervisor refuses to dead-reckon with. Measure them:
    #   python3 examples/measure_travel.py --turns 20 --wheel front_right --spin
    # Measured: 4812 counts over 20.25 wheel turns at gear 20 = 11.88, and the
    # controllers report 4 poles, which is 3 x 4 = 12 exactly. 240 counts per
    # wheel revolution, 1.64 mm of ground per count.
    counts_per_rev: [12.0, 12.0, 12.0, 12.0]

    max_rpm: 600.0            # hard cap per wheel, applied before writing
    command_timeout: 0.5      # s; stop the wheels if commands stop arriving (0 disables)
    # Bus budget, MEASURED on this hardware: a monitor read is 21 ms and a
    # velocity command 30 ms (it writes two registers), both controllers sharing
    # one 19200-baud line. write_rate 10 Hz + publish_rate 5 Hz =
    #   2 x 30 x 10  +  2 x 21 x 5  =  810 ms/s  ~ 81%
    # Raising either oversubscribes the bus. At 102% the command backlog grew
    # until the wheels were answering a stick position seconds old. If it still
    # feels tight, drop write_rate to 8 Hz (69%) before touching publish_rate.
    write_rate: 10.0          # Hz; latched command -> bus
    publish_rate: 5.0         # Hz; joint_states
    diag_rate: 2.0            # Hz; diagnostics
    auto_enable: true         # enable both controllers on startup

    # One controller failing must not take the other with it. After this many
    # consecutive failures it is declared unresponsive and retried only every
    # offline_retry seconds: a failed transaction costs a full serial timeout,
    # and hammering a dead controller every tick starves the live one.
    offline_after: 3
    offline_retry: 1.0
    # Supply voltage into diagnostics. A controller browning out under motor
    # current stops answering and needs a power cycle, which looks identical to
    # a bus fault from software — this is what tells the two apart.
    voltage_rate: 1.0         # Hz; 0 disables
